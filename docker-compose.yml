services:
  nginx:
    image: docker.guygubaby.top/nginx:stable-alpine
    container_name: codex-proxy-nginx
    restart: always
    environment:
      NGINX_PORT: "${NGINX_PORT:-4002}"
      APP_HOST: app
      APP_PORT: "8000"
    ports:
      - "${NGINX_PORT:-4002}:${NGINX_PORT:-4002}"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    command: /bin/sh -c "envsubst '$$NGINX_PORT $$APP_HOST $$APP_PORT' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codex-proxy-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
